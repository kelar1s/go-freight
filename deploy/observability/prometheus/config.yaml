global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'go-freight-inventory'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['inventory:8080', 'host.docker.internal:8080']
